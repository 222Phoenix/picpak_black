name: Daily PicPak Weather

on:
  schedule:
    # GitHub cron is UTC. Run at both possible Pacific-midnight times;
    # the local-time guard below allows only the one that is midnight.
    - cron: "5 7,8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.localtime.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for Pacific midnight
        id: localtime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Los_Angeles date +%H)" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.localtime.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        if: steps.localtime.outputs.run == 'true'
        run: pip install Pillow

      - name: Generate today's card
        if: steps.localtime.outputs.run == 'true'
        run: python generate.py

      - name: Publish image
        if: steps.localtime.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weather.png
          git diff --cached --quiet || git commit -m "Update daily weather card"
          git push

  deploy:
    needs: generate
    if: needs.generate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated image
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload image artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
