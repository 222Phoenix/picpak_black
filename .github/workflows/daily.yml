on:
  push:
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: "5 0 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate today's card
        run: python generate.py
      - name: Create uniquely named image and latest pointer
        id: publishinfo
        run: |
          DATE="$(TZ=America/Los_Angeles date +%F)"
          VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FILE="weather-${DATE}-${VERSION}.png"
          cp docs/weather.png "docs/$FILE"
          URL="https://222phoenix.github.io/picpak_black/$FILE"
          printf '{\n  "date": "%s",\n  "image": "%s"\n}\n' "$DATE" "$URL" > docs/latest.json
          echo "image_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## PicPak image"
            echo ""
            echo "Use this unique URL when adding the image to PicPak:"
            echo ""
            echo "$URL"
            echo ""
            echo "The URL changes on every workflow run to avoid stale cached images."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove generated images older than 30 days
        run: |
          find docs -maxdepth 1 -type f -name 'weather-*.png' -mtime +30 -print -delete
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weather.png docs/weather-*.png docs/latest.json
          git diff --cached --quiet || git commit -m "Update daily weather card"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated image
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload image artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
